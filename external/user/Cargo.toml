[package]
name = "koffee-loader"
version = "0.2.0"
edition = "2021"
description = "Standalone BYOVD loader for the Koffee kernel driver. Invoked as a subprocess by KoffeeHelper.exe on startup; writes READY on stdout, exits."

# v0.3.0-alpha1 (2026-08-28): stripped the Rust 'external as a full app'
# scaffolding (ui/, game/, transport/, features/, probes) — the helper now
# owns everything user-facing in native C++. This crate is loader-only.

[[bin]]
name = "KoffeeLoader"
path = "src/main.rs"

# Dev-only. Ships to nobody. Attached to by the driver in the VM to prove
# read/write against known-value memory before pointing at any real target.
[[bin]]
name = "KoffeeTestTarget"
path = "src/bin/testtarget.rs"

[dependencies]
# Only the API surfaces the loader path actually touches. Feature-gated to
# keep the compiled binary small (loader is a subprocess, so cold-start cost
# is on the helper's critical path).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

# lean release binary: strip + size-optimize + no unwinding machinery
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# faster dev builds
[profile.dev]
opt-level = 0
