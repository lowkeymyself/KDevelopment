[package]
name = "koffee-external"
version = "0.1.0"
edition = "2021"
description = "External Roblox suite -- kernel-driver-backed memory transport + Rust feature port of the Koffee Lua script"

[[bin]]
name = "KoffeeExternal"
path = "src/main.rs"

# Dev-only test target. Runs unprotected in the VM; the driver attaches to it
# and exercises read/write against known-value memory regions. Zero AC, zero
# code protection -- built for BSOD-safe integration testing before we ever
# point the driver at Roblox.
[[bin]]
name = "KoffeeTestTarget"
path = "src/bin/testtarget.rs"

[features]
# Default = mock transport (host dev, no driver, no admin). Build with
# `--features real-driver` in the VM once the driver is loaded to point the
# same feature code at real kernel-driver IOCTLs.
default = []
real-driver = []

[dependencies]
# windows-sys covers everything we need: process enumeration, DeviceIoControl, VirtualQueryEx, etc.
# feature-gated so we only pull the exact API surfaces used (small binary).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

# lean release binary: strip + size-optimize + no unwinding machinery
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# faster dev builds
[profile.dev]
opt-level = 0
