[package]
name = "koffee-external"
version = "0.1.0"
edition = "2021"
description = "External Roblox suite -- kernel-driver-backed memory transport + Rust feature port of the Koffee Lua script"

[[bin]]
name = "KoffeeExternal"
path = "src/main.rs"

[dependencies]
# windows-sys covers everything we need: process enumeration, DeviceIoControl, VirtualQueryEx, etc.
# feature-gated so we only pull the exact API surfaces used (small binary).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

# lean release binary: strip + size-optimize + no unwinding machinery
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# faster dev builds
[profile.dev]
opt-level = 0
